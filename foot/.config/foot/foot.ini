[main]
font=Liberation Mono:size=10.5, JetBrainsMonoNerdFont:size=10.5
pad=7x7
initial-window-mode=windowed
workers=0

[cursor]
style=block
blink=no

[scrollback]
lines=10000
multiplier=7.0

[key-bindings]
# Two clipboards, kept apart on purpose: CLIPBOARD is the Ctrl+Insert one,
# PRIMARY is the mouse-selection one. Foot's default hands Shift+Insert to
# PRIMARY, which makes it a duplicate of middle-click, so move it to CLIPBOARD
# and unbind the key form of primary-paste. Middle-click still pastes PRIMARY
# via the untouched [mouse-bindings] default.
clipboard-copy=Control+Shift+c Control+Insert
clipboard-paste=Control+Shift+v Shift+Insert
primary-paste=none

[colors-dark]
foreground=cecece
background=0e1415
alpha=0.93
